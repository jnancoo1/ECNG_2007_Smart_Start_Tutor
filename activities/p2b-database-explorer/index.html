<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datasheet Explorer: viewer prototype</title>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #59636e;
      --line: #d0d7de;
      --bar: #f6f8fa;
      --parameter: 255, 170, 0;   /* amber: table parameters */
      --figure: 0, 110, 255;      /* blue: graphs and diagrams */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #e9ecef;
    }

    /* ---- toolbar ---- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 8px 12px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    .field, .group { display: inline-flex; align-items: center; gap: 6px; }
    .toolbar button, .toolbar select {
      font: inherit;
      color: inherit;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    .toolbar button:not(:disabled):hover { background: #eef1f4; }
    .toolbar button:disabled { opacity: 0.5; }
    .toolbar button:focus-visible, .toolbar select:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 1px;
    }
    .zoom-label { min-width: 3.5em; text-align: center; }
    .legend { display: flex; gap: 12px; margin: 0 0 0 auto; padding: 0; list-style: none; color: var(--muted); }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid; }
    .swatch--parameter { background: rgba(var(--parameter), 0.22); border-color: rgba(var(--parameter), 0.9); }
    .swatch--figure { background: rgba(var(--figure), 0.22); border-color: rgba(var(--figure), 0.9); }

    #status {
      margin: 0;
      padding: 8px 12px;
      background: #fff3cd;
      border-bottom: 1px solid #e6c870;
    }
    #status[hidden] { display: none; }

    /* ---- page, overlay and tooltip ---- */
    #viewer-wrap { padding: 12px; overflow-x: auto; }
    #page-stage {
      position: relative;
      isolation: isolate;
      width: max-content;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    #pdf-canvas { display: block; }
    #overlay-layer { position: absolute; left: 0; top: 0; }

    .hotspot {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 1px solid;
      border-radius: 2px;
      cursor: pointer;
      background: rgba(var(--tint), 0.22);   /* 22% fill keeps the PDF text readable */
      border-color: rgba(var(--tint), 0.7);
      transition: background-color 0.12s;
    }
    .hotspot--parameter { --tint: var(--parameter); }
    .hotspot--figure { --tint: var(--figure); }
    .hotspot:hover,
    .hotspot[aria-pressed="true"] { background: rgba(var(--tint), 0.45); }
    .hotspot:focus-visible {
      background: rgba(var(--tint), 0.45);
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) { .hotspot { transition: none; } }

    #tooltip {
      position: absolute;
      z-index: 1000;
      width: max-content;
      max-width: min(380px, calc(100% - 8px));
      padding: 10px 12px;
      font-size: 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #6e7781;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }
    #tooltip[hidden] { display: none; }
    .tip-title { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
    .tip-text { margin: 0 0 6px; }
    .tip-source { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .tip-values { width: 100%; margin: 4px 0 8px; border-collapse: collapse; }
    .tip-values th, .tip-values td { padding: 2px 10px 2px 0; text-align: left; font-weight: 400; white-space: nowrap; }
    .tip-values thead th { font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
    .tip-values tbody th { white-space: normal; }
  </style>
</head>
<body>
  <header class="toolbar">
    <label class="field">Datasheet
      <select id="datasheet-select"></select>
    </label>

    <div class="group" role="group" aria-label="Page">
      <button id="prev-btn" type="button">Previous</button>
      <select id="page-select" aria-label="Choose page"></select>
      <button id="next-btn" type="button">Next</button>
    </div>

    <span>PDF page <strong id="current-page-num">&mdash;</strong> of <span id="total-pages">&mdash;</span></span>

    <div class="group" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <span id="zoom-label" class="zoom-label" aria-live="polite">125%</span>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-fit" type="button">Fit width</button>
    </div>

    <ul class="legend" aria-label="Hotspot colours">
      <li><span class="swatch swatch--parameter"></span>Parameter</li>
      <li><span class="swatch swatch--figure"></span>Figure</li>
    </ul>
  </header>

  <p id="status" role="status" hidden></p>

  <main id="viewer-wrap">
    <div id="page-stage">
      <canvas id="pdf-canvas"></canvas>
      <div id="overlay-layer"></div>
      <div id="tooltip" role="tooltip" hidden></div>
    </div>
  </main>

  <script type="module" src="viewer.js"></script>
</body>
</html>
